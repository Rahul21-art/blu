/* =========================================================
   CAMERA (DYNAMIC)
========================================================= */

let cameraTargetOffset=
new THREE.Vector3(
    0,
    2.1,
    0
);

let cameraDesiredOffset=
new THREE.Vector3(
    0,
    4.2,
    10
);

let cameraLerpSpeed=.035;

let cinematicMode=false;

let cinematicTimer=0;

function setOccluderOpacity(mesh,opacity){
    mesh.visible=opacity>.1;
    const materials=Array.isArray(mesh.material) ? mesh.material : [mesh.material];
    for(const material of materials){
        if(!material) continue;
        if(material.userData.bluBaseOpacity===undefined){
            material.userData.bluBaseOpacity=material.opacity ?? 1;
        }
        const needsTransparencyCompile=!material.transparent;
        material.transparent=true;
        material.depthWrite=opacity>.98;
        material.opacity=opacity===1 ? material.userData.bluBaseOpacity : opacity;
        if(needsTransparencyCompile) material.needsUpdate=true;
    }
}

function protectBluFromCameraOcclusion(lookPoint){
    if(!cameraOccluders.length) return;

    /* Restore every wall first.  Only a mesh actually crossing the eye-line
       gets faded on this frame. */
    for(const mesh of cameraOccluders){
        if(mesh.userData.bluOccluding){
            setOccluderOpacity(mesh,1);
            mesh.userData.bluOccluding=false;
        }
    }

    /* Test three body heights. A fence can hide the chest while leaving the
       face visible, so a single centre ray is not enough. */
    const cameraRight=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const bodyPoints=[];
    for(const height of [.4,1.3,2.2,2.75]){
        for(const side of [-.42,0,.42]){
            const point=bluRoot.position.clone().add(new THREE.Vector3(0,height,0));
            point.addScaledVector(cameraRight,side);
            bodyPoints.push(point);
        }
    }
    for(const point of bodyPoints){
        const direction=point.clone().sub(camera.position);
        const distance=direction.length();
        if(distance<.01) continue;
        cameraOcclusionRaycaster.set(camera.position,direction.normalize());
        cameraOcclusionRaycaster.near=.1;
        cameraOcclusionRaycaster.far=Math.max(.1,distance-.18);
        const hits=cameraOcclusionRaycaster.intersectObjects(cameraOccluders,true);
        for(const hit of hits){
            const mesh=hit.object;
            if(!mesh.isMesh || hit.distance<.2) continue;
            /* Fully hide the blocking object for this frame. Transparency
               can still leave a dark silhouette from a dense material. */
            setOccluderOpacity(mesh,0);
            mesh.userData.bluOccluding=true;
        }
    }
}


function updateCamera(){

    if(!bluRoot){
        return;
    }

    /*
     * Dynamic camera based on activity.
     */

    if(isConversing){

        /* Video-call framing: face and shoulders fill the view. */
        cameraDesiredOffset.set(0,3.65,3.4);
        cameraLerpSpeed=.06;

    }

    else if(currentActivity==="run"){

        /*
         * Closer, lower, more exciting angle.
         */

        cameraDesiredOffset.set(
            0,
            2.8,
            7
        );

        cameraLerpSpeed=.045;

    }

    else if(
        currentActivity==="dance" ||
        currentActivity==="fun"
    ){

        /*
         * Slightly side angle for dancing.
         */

        cameraDesiredOffset.set(
            -2,
            3.5,
            8
        );

        cameraLerpSpeed=.04;

    }

    else if(
        currentActivity==="laugh"
    ){

        /*
         * Front-side angle.
         */

        cameraDesiredOffset.set(
            -1.5,
            3.2,
            9
        );

        cameraLerpSpeed=.03;

    }

    else if(isWorking){

        /*
         * Closer view of work.
         */

        cameraDesiredOffset.set(
            0,
            3.5,
            7
        );

        cameraLerpSpeed=.03;

    }

    else if(
        currentActivity==="talk" ||
        currentActivity.startsWith("work")
    ){

        /*
         * Standard talking distance.
         */

        cameraDesiredOffset.set(
            0,
            4,
            9
        );

        cameraLerpSpeed=.03;

    }

    else{

        /*
         * Default relaxed view.
         */

        cameraDesiredOffset.set(
            0,
            4.2,
            10
        );

        cameraLerpSpeed=.035;

    }


    const behind=
    new THREE.Vector3(
        0,
        0,
        1
    );

    behind.applyQuaternion(
        bluRoot.quaternion
    );

    const desired=
    bluRoot.position
    .clone();

    /*
     * Apply offset relative to Blu's facing.
     */

    const right=
    new THREE.Vector3(
        1,
        0,
        0
    );

    right.applyQuaternion(
        bluRoot.quaternion
    );

    desired.addScaledVector(
        behind,
        cameraDesiredOffset.z
    );

    desired.addScaledVector(
        right,
        cameraDesiredOffset.x
    );

    desired.y+=
    cameraDesiredOffset.y;

    /*
     * Smooth camera movement.
     */

    camera.position.lerp(
        desired,
        cameraLerpSpeed
    );

    /*
     * Look at Blu (upper body).
     */

    const targetHeight=isConversing
        ? 3.65
        : 2.1+(currentActivity==="run"?1.8:0);

    cameraTargetOffset.y=
    THREE.MathUtils.lerp(
        cameraTargetOffset.y,
        targetHeight,
        isConversing ? .08 : .03
    );

    const look=
    bluRoot.position
    .clone();

    look.y+=
    cameraTargetOffset.y;

    /* Leave a clear video-call portrait area on the left of the viewport;
       the chat panel stays on the right and never covers Blu's face. */
    if(isConversing){
        look.addScaledVector(right,.55);
    }

    camera.lookAt(
        look
    );

    /* A village wall is never allowed to hide Blu from the viewer. */
    protectBluFromCameraOcclusion(look);

}

/* =========================================================
   TYPE BLU'S MESSAGE
========================================================= */

function estimateSpeechDuration(text){

    const words=text.trim().split(/\s+/).filter(Boolean).length;

    /* A calm video-call pace: about 145 words per minute. */
    return Math.max(1200,Math.round((words/2.42)*1000+500));
}


function speakBluText(text,sequence){

    if(
        !voiceEnabled ||
        !userHasInteracted ||
        !("speechSynthesis" in window) ||
        !("SpeechSynthesisUtterance" in window)
    ){
        return Promise.resolve();
    }

    return new Promise(resolve=>{

        let finished=false;

        const finish=()=>{

            if(finished || sequence!==speechSequence){
                return;
            }

            finished=true;
            speechVoicePlaying=false;
            resolve();
        };

        const utterance=
        new SpeechSynthesisUtterance(
            text.replace(/[\u{1F300}-\u{1FAFF}]/gu,"")
        );

        utterance.rate=.94;
        utterance.pitch=
        targetEmotionType==="happy" ||
        targetEmotionType==="laugh"
        ? 1.08
        : targetEmotionType==="sad"
        ? .90
        : 1;

        const voices=window.speechSynthesis.getVoices();
        const preferredLanguage=(navigator.language||"en").toLowerCase();
        const voice=voices.find(v=>v.lang.toLowerCase()===preferredLanguage) ||
            voices.find(v=>v.lang.toLowerCase().startsWith("en")) ||
            voices.find(v=>v.default);

        if(voice){
            utterance.voice=voice;
        }

        utterance.onstart=()=>{
            if(sequence===speechSequence){
                speechVoicePlaying=true;
            }
        };

        utterance.onboundary=event=>{
            if(
                sequence===speechSequence &&
                Number.isFinite(event.charIndex)
            ){
                speechCharIndex=event.charIndex;
            }
        };

        utterance.onend=finish;
        utterance.onerror=finish;

        /* Some browsers do not fire an event when no system voice is ready. */
        const timeout=window.setTimeout(
            finish,
            speechEstimatedMs+2500
        );

        const finishWithTimeout=()=>{
            window.clearTimeout(timeout);
            finish();
        };

        utterance.onend=finishWithTimeout;
        utterance.onerror=finishWithTimeout;

        try{
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        catch(error){
            console.warn("Blu voice could not start:",error);
            finishWithTimeout();
        }
    });
}


function finishBluSpeech(sequence,callback){

    if(sequence!==speechSequence){
        return;
    }

    window.__bluSpeakActive=false;
    isConversing=false;
    speechVoicePlaying=false;
    activeSpeechText="";
    activeTypingCancel=null;
    showTypingIndicator(false);

    if(!isWorking){
        actionLocked=false;
    }

    window.setTimeout(()=>{
        if(sequence!==speechSequence || isConversing){
            return;
        }

        if(target){
            playAnimation(movementSpeed>=2.5?"run":"walk");
        }
        else if(!isWorking){
            playAnimation("idle");
        }
    },350);

    if(callback){
        callback();
    }
}


function typeBluMessage(
    text,
    callback
){

    if(activeTypingCancel){
        activeTypingCancel();
    }

    const sequence=++speechSequence;

    isConversing=true;
    actionLocked=true;
    window.__bluSpeakActive=true;
    activeSpeechText=text;
    speechCharIndex=0;
    speechStartedAt=performance.now();
    speechEstimatedMs=estimateSpeechDuration(text);
    speechVoicePlaying=false;

    document.getElementById("status").textContent=
    voiceEnabled && userHasInteracted
    ? "Blu is speaking..."
    : "Blu is replying...";

    /*
     * A talking pose is deliberately kept small so the attention stays on
     * the face, just as it would during a video call.
     */

    document.getElementById("emotion").textContent=
    "Blu is speaking...";

    playAnimation(
        "talk"
    );

    /*
     * Type the message character by character.
     */

    const msgDiv=
    document.createElement(
        "div"
    );

    msgDiv.className=
    "msg blu";

    messages.appendChild(
        msgDiv
    );

    let i=0;

    let typingDone=false;
    let voiceDone=false;

    const speedMs=Math.max(
        24,
        Math.min(90,Math.round(speechEstimatedMs/Math.max(1,text.length)))
    );

    let typeInterval=null;

    const completeTyping=()=>{

        if(typingDone || sequence!==speechSequence){
            return;
        }

        typingDone=true;
        isTyping=false;

        if(typeInterval){
            clearInterval(typeInterval);
        }

        msgDiv.textContent=text;
        messages.scrollTop=messages.scrollHeight;

        if(voiceDone){
            finishBluSpeech(sequence,callback);
        }
    };

    activeTypingCancel=()=>{
        if(typeInterval){
            clearInterval(typeInterval);
        }
        typingDone=true;
    };

    isTyping=true;

    typeInterval=
    setInterval(
        ()=>{

            msgDiv.textContent+=text.charAt(i);

            i++;

            messages.scrollTop=
            messages.scrollHeight;

            if(i>=text.length){
                completeTyping();

            }

        },
        speedMs
    );

    const canUseVoice=
    voiceEnabled &&
    userHasInteracted &&
    ("speechSynthesis" in window) &&
    ("SpeechSynthesisUtterance" in window);

    if(!canUseVoice){
        /* Keep the visual reply paced even if a device has no usable voice. */
        voiceDone=true;
        return;
    }

    speakBluText(text,sequence)
    .then(()=>{

        if(sequence!==speechSequence){
            return;
        }

        voiceDone=true;

        /* Keep visual text and voice together if the voice ends first. */
        if(!typingDone){
            completeTyping();
        }
        else{
            finishBluSpeech(sequence,callback);
        }
    });

}

     * Smooth emotion transitions.
     */

    updateEmotionTransition(dt);


    /*
     * Procedural body animation
     * (fake movement when no real animations exist).
     */

    updateProceduralAnimation(dt);


    villageLife(dt);

    updateFollow(dt);

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
        innerWidth/
        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

</body>
</html>
